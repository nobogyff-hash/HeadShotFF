<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prime Tech</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo">

    <div>
      <h1>Prime Tech</h1>
      <p>Sistema de Assistência Técnica</p>
    </div>

  </header>

  <section class="cards">

    <div class="card">
      <h2 id="total">0</h2>
      <span>Total</span>
    </div>

    <div class="card">
      <h2 id="analise">0</h2>
      <span>Em análise</span>
    </div>

    <div class="card">
      <h2 id="reparo">0</h2>
      <span>Em reparo</span>
    </div>

    <div class="card">
      <h2 id="concluido">0</h2>
      <span>Concluídos</span>
    </div>

  </section>

  <section class="formulario">

    <h2>Nova Ordem de Serviço</h2>

    <div class="grid">

      <input type="text" id="nome" placeholder="Nome do cliente">

      <input type="text" id="telefone" placeholder="Telefone">

      <input type="text" id="modelo" placeholder="Modelo do aparelho">

      <input type="text" id="imei" placeholder="IMEI">

      <input type="text" id="senha" placeholder="Senha / padrão">

      <select id="status">
        <option value="Em análise">Em análise</option>
        <option value="Em reparo">Em reparo</option>
        <option value="Concluído">Concluído</option>
      </select>

    </div>

    <textarea id="defeito" placeholder="Defeito relatado"></textarea>

    <div class="checks">

      <label>
        <input type="checkbox">
        Tela quebrada
      </label>

      <label>
        <input type="checkbox">
        Não liga
      </label>

      <label>
        <input type="checkbox">
        Molhado
      </label>

      <label>
        <input type="checkbox">
        Sem chip
      </label>

    </div>

    <div class="grid">

      <input type="text" id="valor" placeholder="Valor">

      <button class="btn salvar">
        Salvar Ordem
      </button>

    </div>

  </section>

  <section class="lista">

    <div class="titulo">

      <h2>Aparelhos cadastrados</h2>

      <input type="text" id="pesquisa" placeholder="Pesquisar aparelho">

    </div>

    <table>

      <thead>

        <tr>
          <th>OS</th>
          <th>Cliente</th>
          <th>Aparelho</th>
          <th>Defeito</th>
          <th>Status</th>
        </tr>

      </thead>

      <tbody id="tabela">

      </tbody>

    </table>

  </section>

  <script src="script.js"></script>

</body>
</html>
